# Safe example configuration for the public portfolio edition.
empresa:
  razon_social: "DEMO AUTO PARTS"
  rfc: "XAXX010101000"
  direccion: "123 Example Avenue, Demo City"
  telefonos: ["0000000000"]
  email: "sales@example.com"
  leyenda_1: "Demo quotation"
  leyenda_2: "Synthetic data only"
precio:
  precio_empresa_id: 1
  moneda_id: 1
  iva_impuesto_id: 1
  iva_tasa: 0.16
  impuestos_exentos_ids: [2, 3]
  escala_precio: 6
  escala_total: 2
calculo:
  redondeo: "ROUND_HALF_UP"
  iva_por_partida: true
almacenes:
  vendibles:
    - id: 1
      nombre: "Main warehouse"
      sucursal: "Main"
    - id: 2
      nombre: "North warehouse"
      sucursal: "North"
firebird:
  modo: "red"
  usuario_env: "FIREBIRD_USER"
  password_env: "FIREBIRD_PASSWORD"
  contenedor_imagen: "docker.io/jacobalberty/firebird:v5"
  isql_bin: "/usr/local/firebird/bin/isql"
  local:
    archivo: "/app/data/demo.fdb"
    mount: "./data"
  red:
    host: "db.example.internal"
    puerto: 3050
    ruta: "/data/DEMO.FDB"
  timeout_seg: 30
  solo_lectura: true
catalogo:
  articulo_estatus_activo: "A"
sqlite:
  path: "./data/catalog.db"
  min_articulos: 1
compatibilidad:
  path: "./data/compatibility.db"
